name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Update system and install XRDP + XFCE + netcat
          sudo apt-get update -y
          sudo apt-get install -y xrdp xfce4 xfce4-terminal netcat sudo

          # Set XFCE as default session for xrdp
          echo "startxfce4" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          # Allow RDP port 3389 through firewall
          sudo ufw allow 3389/tcp
          sudo ufw --force enable

      - name: Create RDP User with Secure Password
        run: |
          # Generate strong random password
          PASSWORD=$(< /dev/urandom tr -dc 'A-Za-z0-9!@#$%^&*()_+-=' | head -c16)
          USERNAME="RDP"
          
          # Create user and add to sudo
          sudo useradd -m -s /bin/bash $USERNAME
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USERNAME

          echo "RDP_CREDS=User: $USERNAME | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID

      - name: Establish Tailscale Connection
        run: |
          # Wait for Tailscale to assign an IP
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
            TS_IP=$(tailscale ip -4 | head -n1)
            sleep 5
            RETRIES=$((RETRIES+1))
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned. Exiting."
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv $TAILSCALE_IP 3389
          if [ $? -ne 0 ]; then
            echo "TCP connection to RDP port 3389 failed"
            exit 1
          fi
          echo "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          echo "=== RDP ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: $RDP_CREDS"
          echo "================="

          # Keep runner alive indefinitely
          while true; do
            echo "[$(date)] RDP Active - Ctrl+C to terminate"
            sleep 300
          done
